<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IPL Chat</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; display: flex; flex-direction: column;
         font-family: system-ui, sans-serif; background: #f3f4f6; color: #111; }
  header { padding: 12px 16px; background: #1d4ed8; color: #fff; font-weight: 600; }
  #messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 75%; padding: 10px 12px; border-radius: 10px; white-space: pre-wrap; line-height: 1.4; }
  .user { align-self: flex-end; background: #1d4ed8; color: #fff; }
  .bot { align-self: flex-start; background: #fff; border: 1px solid #d1d5db; }
  .error { align-self: flex-start; background: #fee2e2; border: 1px solid #fca5a5; color: #991b1b; }
  .mode { margin-top: 8px; font-size: 0.75em; font-weight: 600; color: #1d4ed8; }
  .mode.web { color: #047857; }
  .notice { margin-top: 8px; font-size: 0.8em; color: #92400e; background: #fef3c7; padding: 4px 8px; border-radius: 6px; }
  details { margin-top: 6px; font-size: 0.85em; color: #4b5563; }
  details p { margin: 6px 0 0; padding-top: 6px; border-top: 1px solid #e5e7eb; }
  details a { color: #1d4ed8; font-weight: 600; }
  form { display: flex; gap: 8px; padding: 12px; background: #fff; border-top: 1px solid #d1d5db; }
  input { flex: 1; padding: 10px; font-size: 1em; border: 1px solid #d1d5db; border-radius: 6px; }
  button { padding: 10px 18px; font-size: 1em; background: #1d4ed8; color: #fff;
           border: 0; border-radius: 6px; cursor: pointer; }
  button:disabled { opacity: 0.5; cursor: default; }
</style>
</head>
<body>
  <header>IPL Chat: historical dataset + live web</header>
  <div id="messages"></div>
  <form id="form">
    <input id="input" placeholder="Ask about an IPL match..." autocomplete="off" autofocus>
    <button id="send" type="submit">Send</button>
  </form>

<script>
  const BACKEND_URL = "http://localhost:8000";

  const messages = document.getElementById("messages");
  const form = document.getElementById("form");
  const input = document.getElementById("input");
  const sendButton = document.getElementById("send");

  function addMessage(text, kind) {
    const div = document.createElement("div");
    div.className = "msg " + kind;
    div.textContent = text;
    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
    return div;
  }

  // Only allow http(s) links, so a web result can never inject a javascript: URL
  function safeUrl(u) {
    try {
      const url = new URL(u);
      return (url.protocol === "http:" || url.protocol === "https:") ? url.href : null;
    } catch (e) { return null; }
  }

  function addExtras(div, data) {
    if (data.notice) {
      const n = document.createElement("div");
      n.className = "notice";
      n.textContent = data.notice;
      div.appendChild(n);
    }
    const label = document.createElement("div");
    label.className = "mode " + data.mode;
    label.textContent = data.mode === "web" ? "Answered from live web results" : "Answered from the historical dataset";
    div.appendChild(label);

    const sources = data.sources || [];
    if (sources.length === 0) return;
    const details = document.createElement("details");
    const summary = document.createElement("summary");
    summary.textContent = "Sources (" + sources.length + ")";
    details.appendChild(summary);
    sources.forEach(function (s) {
      const p = document.createElement("p");
      if (s.type === "web") {
        const href = safeUrl(s.url);
        if (href) {
          const a = document.createElement("a");
          a.href = href; a.target = "_blank"; a.rel = "noopener noreferrer";
          a.textContent = s.title || href;
          p.appendChild(a);
        } else {
          p.appendChild(document.createTextNode(s.title || "(untitled)"));
        }
        if (s.published_date) p.appendChild(document.createTextNode(" (" + s.published_date + ")"));
        p.appendChild(document.createElement("br"));
      }
      const text = s.text.length > 400 ? s.text.slice(0, 400) + "..." : s.text;
      p.appendChild(document.createTextNode(text));
      details.appendChild(p);
    });
    div.appendChild(details);
    messages.scrollTop = messages.scrollHeight;
  }

  form.addEventListener("submit", async function (e) {
    e.preventDefault();                     // Enter or the Send button both land here
    const question = input.value.trim();
    if (!question) return;

    addMessage(question, "user");
    input.value = "";
    sendButton.disabled = true;
    const reply = addMessage("Thinking...", "bot");

    try {
      const res = await fetch(BACKEND_URL + "/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question: question })
      });
      if (!res.ok) {
        const err = await res.json().catch(function () { return {}; });
        throw new Error(err.detail || "Server returned " + res.status);
      }
      const data = await res.json();
      reply.textContent = data.answer;
      addExtras(reply, data);
    } catch (err) {
      reply.className = "msg error";
      reply.textContent = (err instanceof TypeError)
        ? "Cannot reach the backend at " + BACKEND_URL + ". Is it running?"
        : "Error: " + err.message;
    }
    sendButton.disabled = false;
    input.focus();
  });
</script>
</body>
</html>
